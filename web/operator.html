<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Brain — Operator Console</title>
<meta name="description" content="The master control surface for Marketing Brain: command centre, approvals, brands and autopilot — live on your workspace.">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fbfcfd; --ink:#0b1524; --ink-2:#3b475a;
  --muted:#6b7688; --line:#e6e9ef; --line-2:#eef1f5; --navy:#001848; --navy-ink:#0a2a63;
  --accent:#3563e9; --accent-soft:#eaf0fe; --ok:#1f9d63; --ok-soft:#e6f6ee; --warn:#b7791f;
  --warn-soft:#fbf1de; --err:#d1435b; --err-soft:#fce8ec; --faint:#c3cad6;
  --shadow:0 1px 2px rgba(11,21,36,.05),0 6px 20px rgba(11,21,36,.05); --radius:14px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0a0f18; --surface:#111827; --surface-2:#0e1521; --ink:#eef2f8; --ink-2:#c2cbd9;
  --muted:#8b97a8; --line:#1e2836; --line-2:#182130; --navy:#0a2350; --navy-ink:#cfe0ff;
  --accent:#6b93ff; --accent-soft:#16233f; --ok:#3ecf8e; --ok-soft:#0f2a1f; --warn:#e3b341;
  --warn-soft:#2a2312; --err:#f2647c; --err-soft:#2c1620; --faint:#3a4761;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f18; --surface:#111827; --surface-2:#0e1521; --ink:#eef2f8; --ink-2:#c2cbd9;
  --muted:#8b97a8; --line:#1e2836; --line-2:#182130; --navy:#0a2350; --navy-ink:#cfe0ff;
  --accent:#6b93ff; --accent-soft:#16233f; --ok:#3ecf8e; --ok-soft:#0f2a1f; --warn:#e3b341;
  --warn-soft:#2a2312; --err:#f2647c; --err-soft:#2c1620; --faint:#3a4761;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;font-size:14px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:99}
.hide{display:none!important}

/* shell */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;font-weight:750;letter-spacing:-.02em;font-size:15px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--accent));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.nav{overflow:auto;padding:6px 10px 12px;flex:1}
.navgrp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink-2);padding:8px 10px;border-radius:9px;font-weight:550;position:relative}
.navitem:hover{background:var(--line-2);color:var(--ink)}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.navitem .ic{width:16px;height:16px;flex:none;opacity:.85}
.navitem .cnt{margin-left:auto;background:var(--err);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.navitem .soon{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);background:var(--line-2);padding:2px 6px;border-radius:6px}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.side-foot .who{min-width:0}.side-foot .who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .who span{font-size:11px;color:var(--muted)}
.iconbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.crumb{font-weight:600;letter-spacing:-.01em}.crumb span{color:var(--muted);font-weight:500}
.topbar .grow{flex:1}
.hstat{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--err)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.wrap{padding:22px;max-width:1200px;width:100%;margin:0 auto;flex:1}
.pagehd{margin-bottom:18px}
.pagehd h1{font-size:24px}.pagehd p{color:var(--muted);margin:4px 0 0}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px}
.metric .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.metric .v{font-size:30px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.metric .d{font-size:12px;font-weight:600;margin-top:2px}.metric .d.up{color:var(--ok)}.metric .d.dn{color:var(--err)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.chip.live{background:var(--ok-soft);color:var(--ok)}.chip.run{background:var(--accent-soft);color:var(--accent)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}.chip.plan{background:var(--line-2);color:var(--muted)}
.chip.role{background:var(--navy);color:#fff}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row .ti{font-weight:600}.row .mt{font-size:12px;color:var(--muted)}
.row .rt{margin-left:auto;text-align:right;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:16px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:14px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:60;font-weight:600;max-width:92vw}
.toast.err{background:var(--err)}

/* approval card */
.appr{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);box-shadow:var(--shadow)}
.appr .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.appr .hd .t{font-weight:650;font-size:15px}
.appr .cap{color:var(--ink-2);font-size:13px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;max-height:120px;overflow:auto}
.appr .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.warnbox{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;margin-top:8px}

/* login */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;padding:20px}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px;width:min(400px,94vw)}
.loginbox h1{font-size:20px;display:flex;align-items:center;gap:10px}
.loginbox p{color:var(--muted);margin:6px 0 18px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 5px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:14px}
input:focus{outline:none;border-color:var(--accent)}
.loginbox .btn{width:100%;justify-content:center;margin-top:18px;display:flex}
.lerr{color:var(--err);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
.mode-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}

@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .menu-toggle{display:grid!important}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
.menu-toggle{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;place-items:center;color:var(--ink)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- LOGIN -->
<div id="login">
  <form class="loginbox" onsubmit="doLogin(event)">
    <h1><span class="logo" style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800">MB</span> Operator Console</h1>
    <p>Sign in to your Marketing Brain workspace. Master accounts see every company; owners see their own.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required placeholder="you@company.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required placeholder="••••••••">
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <div class="lerr" id="lerr" role="alert"></div>
    <div class="mode-note">One login works across the console and the <a href="/">brand app</a> — same secure session.</div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><span class="logo">MB</span> Marketing Brain</div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="side-foot">
      <div class="avatar" id="avatar">·</div>
      <div class="who"><b id="whoEmail">—</b><span id="whoRole">—</span></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">◐</button>
      <button class="iconbtn" title="Sign out" onclick="logout()">⎋</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb">Command Center</div>
      <div class="grow"></div>
      <div class="hstat" id="hstat" title="Live backend status"><span class="dot" id="hdot"></span><span id="htext">checking…</span></div>
      <button class="btn accent sm" onclick="go('ask')">Ask Brain</button>
      <a class="btn sm" href="/" title="Open the per-brand app">Brand app ↗</a>
    </div>
    <div class="wrap" id="main"><div class="empty"><span class="spin"></span></div></div>
  </main>
</div>

<script>
"use strict";
const API = "/api";
let TOKEN = localStorage.getItem("mb_token") || "";
let ME = null;
let VIEW = "dash";
let BRANDS = [];
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => t? new Date(t*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
function toast(m, err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), err?6000:3500); }

class ApiError extends Error{ constructor(m,s){ super(m); this.status=s; } }
async function api(path, method="GET", body){
  const opt={method,headers:{}};
  if(TOKEN) opt.headers.Authorization="Bearer "+TOKEN;
  if(body){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),180000); opt.signal=ctl.signal;
  let r; try{ r=await fetch(API+path,opt); } catch(e){ clearTimeout(timer); throw new ApiError(e.name==="AbortError"?"The server took too long — try again.":"Network error.",0); }
  clearTimeout(timer);
  if(r.status===401){ TOKEN=""; localStorage.removeItem("mb_token"); showLogin(); throw new ApiError("Your session expired — sign in again.",401); }
  if(r.status===429){ let d={}; try{d=await r.json()}catch{} throw new ApiError(d.detail||"Rate limit reached — try again shortly.",429); }
  if(!r.ok){ let d={}; try{d=await r.json()}catch{} throw new ApiError(r.status>=500?"Something went wrong on our side.":(typeof d.detail==="string"?d.detail:r.statusText),r.status); }
  return r.status===204?null:r.json();
}

/* ---------- theme ---------- */
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); $("#themeBtn").textContent=t==="dark"?"◑":"◐"; }
function toggleTheme(){ const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; try{localStorage.setItem("mb_theme",n)}catch{} applyTheme(n); }
(function(){ let t="light"; try{t=localStorage.getItem("mb_theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch{} applyTheme(t); })();

/* ---------- auth ---------- */
function showLogin(){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }
async function doLogin(e){
  e.preventDefault(); const btn=$("#loginBtn"); btn.disabled=true; btn.textContent="Signing in…"; $("#lerr").textContent="";
  try{
    const r=await api("/auth/login","POST",{email:$("#email").value.trim(),password:$("#pw").value});
    TOKEN=r.token; localStorage.setItem("mb_token",TOKEN); localStorage.setItem("mb_me",JSON.stringify(r));
    await boot();
  }catch(err){ $("#lerr").textContent=err.message; btn.disabled=false; btn.textContent="Sign in"; }
}
function logout(){ TOKEN=""; localStorage.removeItem("mb_token"); localStorage.removeItem("mb_me"); ME=null; showLogin(); }

/* ---------- navigation ---------- */
const NAV=[
  {grp:"COMMAND", items:[["dash","Command Center",true],["ask","Ask Brain",true]]},
  {grp:"KNOW", items:[["brands","Brands",true],["activity","Activity",true]]},
  {grp:"CREATE", items:[["approvals","Approvals",true]]},
  {grp:"MEASURE", items:[["autopilot","Autopilot",true]]},
  {grp:"SYSTEM", items:[["connections","Connections",true],["system","System health",true]]},
];
function renderNav(counts){
  let h="";
  for(const g of NAV){
    h+=`<div class="navgrp">${g.grp}</div>`;
    for(const [id,label,live] of g.items){
      const cnt = id==="approvals"&&counts&&counts.waiting ? `<span class="cnt">${counts.waiting}</span>` : "";
      h+=`<button class="navitem ${VIEW===id?'on':''}" onclick="go('${id}')"><span class="ic">${ICON[id]||""}</span>${label}${cnt}</button>`;
    }
  }
  $("#nav").innerHTML=h;
}
const ICON={
  dash:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  ask:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  brands:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V7l6-4 6 4v14M10 9h.01M14 9h.01M10 13h.01M14 13h.01"/></svg>',
  activity:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  approvals:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  autopilot:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>',
  connections:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12a3 3 0 0 0 3 3l4-4a3 3 0 0 0-4-4"/><path d="M15 12a3 3 0 0 0-3-3l-4 4a3 3 0 0 0 4 4"/></svg>',
  system:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 4v6l4 2"/></svg>',
};
function go(v){ VIEW=v; $("#side").classList.remove("open"); renderNav(window.__counts); const t={dash:"Command Center",ask:"Ask Brain",brands:"Brands",activity:"Activity",approvals:"Approvals",autopilot:"Autopilot",connections:"Connections",system:"System health"}[v]; $("#crumb").innerHTML=`<span>Operator</span> · ${t}`; render(); }

/* ---------- boot ---------- */
async function boot(){
  try{ ME=await api("/auth/me"); }catch(e){ return; }
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#whoEmail").textContent=ME.email||"—";
  $("#whoRole").innerHTML = ME.role==="admin"?'<span class="chip role">Master account</span>':`<span class="chip role">${esc(ME.role||"user")}</span>`;
  $("#avatar").textContent=(ME.email||"?")[0].toUpperCase();
  pollHealth(); setInterval(pollHealth, 60000);
  try{ BRANDS=await api("/brands"); }catch{ BRANDS=[]; }
  try{ const a=await api("/approvals"); window.__counts=a.counts; }catch{}
  renderNav(window.__counts); go("dash");
}
async function pollHealth(){
  try{ const h=await api("/health"); const ok=h.ok&&h.persistent_db; $("#hdot").className="dot "+(ok?"ok":"bad"); $("#htext").textContent=ok?"Live · secure · persistent":"degraded"; }
  catch{ $("#hdot").className="dot bad"; $("#htext").textContent="offline"; }
}

/* ---------- views ---------- */
function loading(){ $("#main").innerHTML='<div class="empty"><span class="spin"></span> Loading…</div>'; }
async function render(){
  loading();
  try{
    if(VIEW==="dash") return await viewDash();
    if(VIEW==="ask") return viewAsk();
    if(VIEW==="brands") return await viewBrands();
    if(VIEW==="activity") return await viewActivity();
    if(VIEW==="approvals") return await viewApprovals();
    if(VIEW==="autopilot") return await viewAutopilot();
    if(VIEW==="connections") return await viewConnections();
    if(VIEW==="system") return await viewSystem();
  }catch(e){ $("#main").innerHTML=`<div class="pagehd"><h1>Couldn't load this</h1><p>${esc(e.message)}</p></div><button class="btn" onclick="render()">Retry</button>`; }
}

async function viewDash(){
  const [digest,activity,ap]=await Promise.all([api("/digest").catch(()=>({})), api("/activity").catch(()=>[]), api("/autopilot/status").catch(()=>({}))]);
  const brandsN=BRANDS.length, na=(digest.needs_approval||[]).length, due=(digest.due_today||[]).length, running=Object.values(ap||{}).filter(x=>x&&x.state==="running").length;
  const hour=new Date().getHours(); const greet=hour<12?"Good morning":hour<18?"Good afternoon":"Good evening";
  let h=`<div class="pagehd"><h1>${greet}</h1><p>${esc(ME.email)} · ${new Date().toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"})}</p></div>`;
  h+=`<div class="grid g4">
    ${metric("Companies", brandsN, ME.role==="admin"?"across your workspace":"your workspace")}
    ${metric("Awaiting approval", na, na?"needs a decision":"all clear", na?"warn":"ok")}
    ${metric("Scheduled today", due, "calendar items")}
    ${metric("Autopilot running", running, running?"generating now":"idle", running?"run":"")}
  </div>`;
  // opportunities-style: what needs you
  h+=`<div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>What needs you</h2><p class="sub">Decisions and items waiting on a human.</p><div class="list" style="margin-top:8px">`;
  const need=(digest.needs_approval||[]).slice(0,6);
  if(!need.length) h+=`<div class="empty"><div class="big">All clear 🎉</div>Nothing is waiting for approval.</div>`;
  else need.forEach(i=>{ h+=`<div class="row"><div><div class="ti">${esc(i.title||"Untitled")}</div><div class="mt">${esc(i.brand||"")} · ${esc(i.format||i.channel||"")}</div></div><div class="rt"><button class="btn accent sm" onclick="go('approvals')">Review</button></div></div>`; });
  h+=`</div></div>`;
  h+=`<div class="card"><h2>Today's AI work</h2><p class="sub">Latest activity across the workspace.</p><div class="list" style="margin-top:8px">`;
  const act=(activity||[]).slice(0,7);
  if(!act.length) h+=`<div class="empty">No activity yet.</div>`;
  else act.forEach(a=>{ h+=`<div class="row"><span class="tag">${esc(a.type||"")}</span><div><div class="ti">${esc(a.title||"")}</div><div class="mt">${esc(a.brand||"")}</div></div><div class="rt mt">${fmtTime(a.at)}</div></div>`; });
  h+=`</div></div></div>`;
  $("#main").innerHTML=h;
}
function metric(k,v,d,cls){ return `<div class="card metric"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="d ${cls==='up'||cls==='ok'?'up':cls==='dn'||cls==='warn'?'dn':''}">${esc(d||"")}</div></div>`; }

async function viewBrands(){
  BRANDS=await api("/brands");
  let h=`<div class="pagehd"><h1>Brands</h1><p>${BRANDS.length} ${ME.role==="admin"?"companies in your workspace":"workspace"}. Deep work happens in the brand app.</p></div>`;
  if(!BRANDS.length){ h+=`<div class="card empty"><div class="big">No companies yet</div>${ME.role==="admin"?"Create one in the brand app to get started.":"Ask your workspace admin to add your company."}</div>`; $("#main").innerHTML=h; return; }
  h+=`<div class="grid g3">`;
  BRANDS.forEach(b=>{
    const st=b.status||"—"; const cls=st==="ready"?"live":"wait";
    h+=`<div class="card"><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="border-radius:9px">${esc((b.name||"?")[0])}</div><div style="min-width:0"><h2 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</h2><div class="mt">${esc(b.website||"")}</div></div></div>
      <div style="margin:12px 0"><span class="chip ${cls}">${esc(st)}</span></div>
      <div style="display:flex;gap:8px"><a class="btn sm" href="/#brand=${encodeURIComponent(b.id)}">Open in app ↗</a><button class="btn sm ghost" onclick="askFor('${esc(b.id)}','${esc(b.name)}')">Ask Brain</button></div></div>`;
  });
  h+=`</div>`; $("#main").innerHTML=h;
}

async function viewActivity(){
  const activity=await api("/activity");
  let h=`<div class="pagehd"><h1>Activity</h1><p>Everything the system has done across ${ME.role==="admin"?"all companies":"your workspace"}, newest first.</p></div><div class="card"><div class="list">`;
  if(!activity.length) h+=`<div class="empty">No activity recorded yet.</div>`;
  else activity.forEach(a=>{ h+=`<div class="row"><span class="tag">${esc(a.type||"")}</span><div><div class="ti">${esc(a.title||"")}</div><div class="mt">${esc(a.brand||"")} · ${esc(a.channel||"")}</div></div><div class="rt mt">${fmtTime(a.at)}</div></div>`; });
  h+=`</div></div>`; $("#main").innerHTML=h;
}

async function viewApprovals(){
  const q=await api("/approvals"); window.__counts=q.counts; renderNav(q.counts);
  const waiting=q.waiting_for_approval||[], changes=q.changes_requested||[];
  let h=`<div class="pagehd"><h1>Approval Center</h1><p>${waiting.length? waiting.length+" decision"+(waiting.length>1?"s":"")+" require you." : "Nothing is waiting for a decision."} High-impact actions always pass through here.</p></div>`;
  if(!waiting.length && !changes.length){ h+=`<div class="card empty"><div class="big">All clear 🎉</div>Every creative has been reviewed.</div>`; $("#main").innerHTML=h; return; }
  if(waiting.length){ h+=`<div class="grid g2">`; waiting.forEach(i=>h+=apprCard(i,false)); h+=`</div>`; }
  if(changes.length){ h+=`<h2 style="margin:22px 0 12px">Changes requested</h2><div class="grid g2">`; changes.forEach(i=>h+=apprCard(i,true)); h+=`</div>`; }
  $("#main").innerHTML=h;
}
function apprCard(i,isChange){
  const asset = i.asset_path ? (i.asset_path.startsWith("http")?i.asset_path:"") : "";
  return `<div class="appr" id="appr-${esc(i.id)}">
    <div class="hd"><span class="tag">${esc(i.format||i.channel||"post")}</span><span class="t">${esc(i.title||"Untitled")}</span><span class="chip ${i.ready?'live':'wait'}" style="margin-left:auto">${i.ready?"ready":"generating"}</span></div>
    <div class="mt">${esc(i.brand||"")}</div>
    ${i.caption?`<div class="cap">${esc(i.caption)}</div>`:""}
    ${isChange&&i.comment?`<div class="warnbox">Requested change: ${esc(i.comment)}</div>`:""}
    <div class="acts">
      <button class="btn ok sm" onclick="decide('${esc(i.brand_id)}','${esc(i.id)}','approved',this)">Approve</button>
      <button class="btn sm" onclick="decide('${esc(i.brand_id)}','${esc(i.id)}','changes_requested',this)">Request changes</button>
      <a class="btn ghost sm" href="/#brand=${encodeURIComponent(i.brand_id)}">Open in app ↗</a>
    </div></div>`;
}
async function decide(bid,cid,state,btn){
  let comment="";
  if(state==="changes_requested"){ comment=prompt("What should change?")||""; if(!comment) return; }
  btn.disabled=true; btn.textContent="…";
  try{
    await api(`/brands/${bid}/creatives/${cid}/approval`,"POST",{state,comment});
    const el=document.getElementById("appr-"+cid); if(el){ el.style.opacity=".4"; el.querySelector(".acts").innerHTML=`<span class="chip ${state==='approved'?'live':'wait'}">${state==='approved'?'Approved ✓':'Changes requested'}</span>`; }
    toast(state==="approved"?"Approved":"Change request sent");
    try{ const a=await api("/approvals"); window.__counts=a.counts; renderNav(a.counts); }catch{}
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent=state==="approved"?"Approve":"Request changes"; }
}

async function viewAutopilot(){
  const st=await api("/autopilot/status");
  let h=`<div class="pagehd"><h1>Autopilot</h1><p>AI-Assist and Autopilot generate work; every high-impact action still routes to Approvals. Nothing publishes or spends without a human.</p></div>`;
  const brands = ME.role==="admin"? BRANDS : BRANDS;
  h+=`<div class="card"><div class="list">`;
  if(!brands.length) h+=`<div class="empty">No companies to run.</div>`;
  brands.forEach(b=>{
    const j=st[b.id]; const running=j&&j.state==="running";
    h+=`<div class="row"><div><div class="ti">${esc(b.name)}</div><div class="mt">${running?("running · "+esc((j.log||[]).slice(-1)[0]||"working…")):(j?("last: "+esc(j.state||"")):"idle")}</div></div>
      <div class="rt">${running?'<span class="chip run">running</span>':`<button class="btn accent sm" onclick="startAP('${esc(b.id)}',this)">Start</button>`}</div></div>`;
  });
  h+=`</div></div>`;
  h+=`<div class="warnbox" style="max-width:640px">Autopilot follows configured policy. Publishing, ad spend, new campaigns and brand changes are never executed automatically — they wait in Approvals.</div>`;
  $("#main").innerHTML=h;
}
async function startAP(bid,btn){ btn.disabled=true; btn.textContent="Starting…"; try{ await api(`/brands/${bid}/autopilot`,"POST",{}); toast("Autopilot started"); setTimeout(()=>render(),800); }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="Start"; } }

async function viewConnections(){
  let h=`<div class="pagehd"><h1>Connections</h1><p>Publishing channels per company. Live posting uses each company's own platform credentials.</p></div>`;
  h+=`<div class="card"><div class="list">`;
  for(const b of BRANDS){
    let cfg=[]; try{ const c=await api(`/brands/${b.id}/connectors`); cfg=c.configured||[]; }catch{}
    h+=`<div class="row"><div><div class="ti">${esc(b.name)}</div><div class="mt">${cfg.length?("connected: "+cfg.map(esc).join(", ")):"no channels connected"}</div></div>
      <div class="rt">${cfg.length?'<span class="chip live">'+cfg.length+' live</span>':'<span class="chip plan">none</span>'} <a class="btn sm ghost" href="/#brand=${encodeURIComponent(b.id)}">Manage ↗</a></div></div>`;
  }
  h+=`</div></div>`;
  h+=`<div class="card" style="margin-top:16px"><h2>Supported today</h2><p class="sub">Instagram & Facebook publish live via the Meta Graph API using each company's own long-lived token. LinkedIn is supported; X and analytics pull-back are on the roadmap.</p></div>`;
  $("#main").innerHTML=h;
}

async function viewSystem(){
  const h0=`<div class="pagehd"><h1>System health</h1><p>Live status of the backend both this console and the brand app run on.</p></div>`;
  let h="";
  try{
    const hh=await api("/health");
    h+=`<div class="grid g3">
      ${sysCard("API", hh.ok, hh.ok?"online":"down")}
      ${sysCard("Persistent database", hh.persistent_db, hh.persistent_db?"durable (survives redeploys)":"ephemeral")}
      ${sysCard("Auth enforced", !hh.direct_access, hh.direct_access?"OPEN — insecure":"secure")}
    </div>`;
    h+=`<div class="card" style="margin-top:16px"><h2>Model</h2><p class="sub">Text model: <b>${esc(hh.model||"—")}</b> · generation key ${hh.key_configured?'<span class="chip live">configured</span>':'<span class="chip plan">missing</span>'}</p></div>`;
  }catch(e){ h+=`<div class="card empty">Backend unreachable: ${esc(e.message)}</div>`; }
  h+=`<div class="card" style="margin-top:16px"><h2>How this connects</h2><p class="sub">The operator console and the brand app are two views of one backend. Your session token works across both. The console is the master surface (all companies for a master account, your own for an owner); the brand app is where per-company production happens. Access is enforced server-side on every request.</p></div>`;
  $("#main").innerHTML=h0+h;
}
function sysCard(k,ok,txt){ return `<div class="card"><div class="metric"><div class="k">${esc(k)}</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="dot ${ok?'ok':'bad'}"></span><b style="font-size:16px">${esc(txt)}</b></div></div></div>`; }

/* ---------- Ask Brain ---------- */
let ASK_BRAND=null;
function askFor(bid,name){ ASK_BRAND={id:bid,name}; go("ask"); }
function viewAsk(){
  const b=ASK_BRAND || BRANDS[0];
  let h=`<div class="pagehd"><h1>Ask Brain</h1><p>Natural-language questions grounded in a company's own workspace and verified facts.</p></div>`;
  if(!BRANDS.length){ h+=`<div class="card empty">Add a company first.</div>`; $("#main").innerHTML=h; return; }
  h+=`<div class="card" style="max-width:760px">
    <label for="askBrand">Company</label>
    <select id="askBrand" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)">
      ${BRANDS.map(x=>`<option value="${esc(x.id)}" ${b&&x.id===b.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    <label for="askQ" style="margin-top:12px">What do you want to accomplish?</label>
    <textarea id="askQ" rows="3" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-family:inherit;resize:vertical" placeholder="e.g. Give me 3 content angles for this month, or Why did engagement drop?"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      ${["Create content ideas","Analyze performance","Research competitors","Find opportunities"].map(s=>`<button class="btn sm ghost" onclick="document.getElementById('askQ').value='${s}'">${s}</button>`).join("")}
      <span style="flex:1"></span><button class="btn accent" onclick="askSend(this)">Ask</button></div>
    <div id="askOut" style="margin-top:16px"></div>
  </div>`;
  $("#main").innerHTML=h;
}
async function askSend(btn){
  const bid=$("#askBrand").value, q=$("#askQ").value.trim(); if(!q) return;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  $("#askOut").innerHTML=`<div class="row"><span class="spin"></span> Brain is working…</div>`;
  try{
    const r=await api(`/brands/${bid}/chat`,"POST",{message:q});
    const reply=r.reply||r.answer||r.message||"(no reply)";
    $("#askOut").innerHTML=`<div class="cap" style="max-height:none">${esc(reply)}</div>`;
  }catch(e){ $("#askOut").innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
  btn.disabled=false; btn.textContent="Ask";
}

/* ---------- start ---------- */
if(TOKEN){ boot(); } else { showLogin(); }
</script>
</body>
</html>
