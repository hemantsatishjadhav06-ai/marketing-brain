services:
  - type: web
    name: marketing-brain-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Auth bypass. NEVER "true" on a reachable deployment: it makes every
      # request an unauthenticated admin. Kept explicit so the default is visible.
      - key: DIRECT_ACCESS
        value: "false"
      # Signs bearer tokens. Without it the app falls back to a hard-coded
      # default and anyone can mint a valid token.
      - key: SECRET_KEY
        generateValue: true
      # Creates the first admin on boot; without these, turning DIRECT_ACCESS
      # off locks everyone out because no account exists.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Generated assets are referenced by <img src>, which cannot send the auth
      # header, so they must stay world-readable by URL for the UI to render.
      # Set to false and serve assets from object storage to close that off.
      - key: PUBLIC_WORKSPACES
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_IMAGE_MODEL
        value: openai/gpt-image-1
      - key: AIRTABLE_TOKEN
        sync: false
      - key: AIRTABLE_WEBHOOK_SECRET
        sync: false
      - key: AIRTABLE_BASE_ID
        value: appvpMfpbNQDkUGeF
      - key: AIRTABLE_CONTENT_TABLE_ID
        value: tblWu3YzDoasrj0OG
      - key: AIRTABLE_SLIDES_TABLE_ID
        value: tblAbMcwp6DipTQqu
      - key: AIRTABLE_CLAIMS_TABLE_ID
        value: tbluMV1yECqSjpY0S
      - key: AIRTABLE_PROJECTS_TABLE_ID
        value: tblXdFUMM6E6qSKLF
      - key: AIRTABLE_BRAND_RULES_TABLE_ID
        value: tblP2Gqh59vI79IqW
      - key: AIRTABLE_RUNS_TABLE_ID
        value: tblir6QJU0Vo4qBeP
      - key: AIRTABLE_APPROVALS_TABLE_ID
        value: tbl7C6O77DDf6zd9D
      - key: DB_PATH
        value: /var/data/marketing_brain.db
      - key: WORKSPACES_ROOT
        value: /var/data/workspaces
      - key: PUBLIC_BASE_URL
        value: https://marketing-brain-web.onrender.com
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
